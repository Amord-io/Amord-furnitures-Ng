<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | FurniHub 9ja</title>
    <style>
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --bg-card: #1a1a1a;
            --border-color: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-muted: #777777;
            --accent: #ff6a00;
            --whatsapp: #25D366;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-primary); line-height: 1.6; }
        
        .product-page { max-width: 900px; margin: 0 auto; padding: 20px; }
        .header { background: #1a1a1a; padding: 15px 20px; text-align: center; border-bottom: 1px solid var(--border-color); margin-bottom: 30px; }
        .header img { height: 50px; max-width: 100%; }
        
        .product-detail { background: var(--bg-card); border-radius: 20px; overflow: hidden; border: 1px solid var(--border-color); }
        .product-image { width: 100%; max-height: 500px; object-fit: contain; background: #0a0a0a; display: block; }
        .product-info { padding: 30px; }
        
        .product-title { font-size: 28px; font-weight: 800; margin-bottom: 10px; }
        .product-price { font-size: 24px; font-weight: 800; color: var(--accent); margin-bottom: 15px; }
        .product-vendor { font-size: 14px; color: var(--text-secondary); margin-bottom: 10px; text-transform: uppercase; }
        .product-code { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
        .product-desc { font-size: 16px; color: var(--text-secondary); margin-bottom: 30px; line-height: 1.8; }
        
        .whatsapp-btn { display: inline-flex; align-items: center; gap: 10px; background: var(--whatsapp); color: #fff; border: none; border-radius: 50px; padding: 15px 30px; font-size: 18px; font-weight: 700; cursor: pointer; text-decoration: none; transition: 0.3s; }
        .whatsapp-btn:hover { background: #20bd5a; transform: scale(1.05); }
        
        .back-home { display: inline-block; margin-top: 20px; color: var(--text-secondary); text-decoration: none; font-size: 14px; }
        .back-home:hover { color: var(--accent); }
        
        @media (max-width: 600px) {
            .product-title { font-size: 22px; }
            .product-price { font-size: 20px; }
            .product-info { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://i.ibb.co/YTT56gY4/Chat-GPT-Image-Sep-8-2026-01-41-16-AM.png" alt="FurniHub 9ja">
    </div>

    <div class="product-page">
        <div id="productContainer"></div>
        <a href="index.html" class="back-home">← Back to Home</a>
    </div>

    <script>
        // CONFIGURATION
        const SHEETDB_URL = 'https://sheetdb.io/api/v1/167chhsgiemnd';

        async function loadProduct() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');

            if (!code) {
                document.getElementById('productContainer').innerHTML = '<p style="text-align:center; color: #777; padding: 50px;">No product code provided.</p>';
                return;
            }

            try {
                const response = await fetch(SHEETDB_URL);
                const data = await response.json();
                
                const product = data.find(item => item.code === code);

                if (!product) {
                    document.getElementById('productContainer').innerHTML = '<p style="text-align:center; color: #777; padding: 50px;">Product not found.</p>';
                    return;
                }

                document.getElementById('productContainer').innerHTML = `
                    <div class="product-detail">
                        <img class="product-image" src="${product.image}" alt="${product.name}">
                        <div class="product-info">
                            <h1 class="product-title">${product.name}</h1>
                            <div class="product-price">₦${Number(product.price).toLocaleString('en-NG')}</div>
                            <div class="product-vendor">Sold by: ${product.vendor || 'FurniHub 9ja'}</div>
                            <div class="product-code">Product Code: ${product.code}</div>
                            <p class="product-desc">${product.description || 'Premium quality furniture for your home.'}</p>
                            
                            <a class="whatsapp-btn" href="https://wa.me/${product.sellerWhatsApp || '2348100578413'}?text=${encodeURIComponent('Hello, I am interested in this product from FurniHub 9ja:\n\nProduct: ' + product.name + '\nCode: ' + product.code + '\nPrice: ₦' + Number(product.price).toLocaleString('en-NG'))}" target="_blank">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                                Chat with Seller on WhatsApp
                            </a>
                        </div>
                    </div>
                `;
            } catch (error) {
                document.getElementById('productContainer').innerHTML = '<p style="text-align:center; color: #777; padding: 50px;">Error loading product. Please try again.</p>';
                console.error("Error:", error);
            }
        }

        loadProduct();
    </script>
</body>
</html>
